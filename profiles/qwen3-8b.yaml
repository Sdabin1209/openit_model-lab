# 학습 서버 어댑터(Qwen3-8B, rank 16, 모든 선형층)용 프로파일. 24GB급 GPU 서빙 대상(D74: 24GB급은 8B 이상).
# package-adapters가 기반 모델과 최대 rank를 대조한다. 학습 설정은 서버 정본 코드가 정하므로 여기에 두지 않는다.
# model-runtime의 서빙 프로파일 ../model-runtime/profiles/rtx4090-24g.json과 base_model(Qwen/Qwen3-8B)·max_lora_rank(16)를 맞췄다.
# 이름은 코드로 연결되지 않는다: model-lab은 이 파일 이름(--profile, 학습 설정의 base_model.profile)만 보고, model-runtime 프로파일 이름은 서빙 쪽에서 따로 고른다.
# 14B 프로파일은 만들지 않았다: 14B는 A만 학습되어 있어(head/docs/impact-d74.md) A·B 둘을 함께 얹는 package-adapters에 쓸 수 없고, 24GB bf16에도 들어가지 않는다(rtx4090-24g.json 주석).
base_model:
  id: Qwen/Qwen3-8B
  revision: main
checks:
  max_lora_rank: 16
