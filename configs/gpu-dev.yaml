# 실제 실행 설정(gpu-dev, 12GB). 데이터셋은 synthetic-data가 낸 파일 저장소를 읽고, 모델 레지스트리와 실패 사례 저장소는 HTTP로 닿는다.
# 필요한 환경 변수: DATASET_ROOT(데이터셋 루트 경로), MODEL_REGISTRY_URL, MODEL_REGISTRY_WRITE_TOKEN, FAILURE_STORE_URL, FAILURE_STORE_TOKEN
# 네트워크 경계(어느 주소로 닿는지)는 운영에서 사용자와 정하기 전이라 가정이다. 개발에서는 SSH 역터널(docs/runbook.md 맨 위).
config_version: 1
profile: ../profiles/gpu-dev-12g.yaml
run: {name: gpu-dev, seed: 1234, runs_dir: ../runs}
inputs:
  schema_dir: ../vendor/survey-schema/schemas        # 호스트에서는 문진 스키마 사본(vendor/). 개발 PC에서는 ../../survey-service/schema/schemas
  dataset: {id: openit-dataset}                        # 데이터셋 ID는 synthetic-data의 설정에 맞춘다. version 생략 = 최신
  dataset_store: {factory: "model_lab.file_dataset_store:file_dataset_store", args: {root_env: DATASET_ROOT}}
  failure_store: {factory: "boundary_contracts.clients:HttpFailureStore", args: {base_url_env: FAILURE_STORE_URL, token_env: FAILURE_STORE_TOKEN}}
roles:
  LORA_A: {package_id: lora-a-parser}
  LORA_B: {package_id: lora-b-generator}
serving:
  LORA_A: &serving
    prompt_template_version: prompt-2
    decoding: {constraint_mode: none, temperature: 0, seed: 1000, max_tokens: 512}
    max_attempts: 3
    constraint: {backend: hf-transformers, backend_version: "1", supported_features: [], relax_policy_version: relax-1}
    output_contract: 1
    protection_policy_version: protect-1
  LORA_B: *serving
evaluation:
  backend: {kind: hf}
  split: EVAL
  regression: {enabled: true, label: "r1"}             # 확정된 실패 사례(정답 있음)로 회귀 평가. 끄려면 enabled: false
registry: {kind: http, base_url_env: MODEL_REGISTRY_URL, token_env: MODEL_REGISTRY_WRITE_TOKEN, timeout: 300}
