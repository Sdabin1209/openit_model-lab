# 학습 서버 정본 코드를 감싸는 학습 설정 (D78, G06). 명령: python -m model_lab train --config configs/train.yaml [--dry-run]
# 점검: python -m model_lab train-doctor --config configs/train.yaml
# 학습 서버에서 실행한다(GPU 필요). 비밀은 적지 않는다(적으면 시작을 거부한다).
# [미확인] 서버에 접속하지 못해(2026-10-27 ssh 연결 거부) 인자 이름·산출물 위치는 확인하지 못했다. 아래 TODO 표시를 서버에서 채운다.
config_version: 1
role: LORA_A                       # LORA_A | LORA_B (역할마다 설정을 하나씩, 또는 이 값만 바꿔 쓴다)
server:
  code_dir: ~/taehyeon             # 정본 코드 위치. [확인: 이전 세션이 ~/taehyeon/train_lora_a.py, ~/myungchan/train_lora_b.py를 읽음] 서버 사용자 홈 기준
  scripts: {LORA_A: train_lora_a.py, LORA_B: train_lora_b.py}   # B는 code_dir이 ~/myungchan이다. B로 쓸 때 code_dir을 바꾼다
  python: python3                  # 학습 환경의 파이썬(가상환경이면 그 경로)
  require_gpu: true
  args_verified: false             # TODO: 서버 스크립트의 인자 이름을 확인해 arg_map을 채우고 true로
  arg_map:                         # 이름 -> 서버 스크립트 인자. null이면 넘기지 않는다(스크립트 기본값)
    base_model: null               # TODO 예: --model
    dataset_dir: null              # TODO
    dataset_prefix: null           # TODO
    output_dir: null               # TODO
    learning_rate: null
    epochs: null
    per_device_batch_size: null
    grad_accum_steps: null
    max_len: null
    seed: null
    lora_r: null
    lora_alpha: null
base_model:
  id: Qwen/Qwen3-4B                # 4B | 8B | 14B 중 하나 (Qwen/Qwen3-8B 등)
  revision: main
  profile: qwen3-4b                # profiles/<이름>.yaml. package-adapters가 쓴다
dataset:
  dir: ~/taehyeon/data/dataset_10_14   # 서버 데이터 폴더. 파일: <prefix>_{train,val,test}.jsonl
  prefix: lora_a
  id: dataset_10_14
  version: v2
  # content_hash: sha256:...       # 서버 run 기록의 dataset 값(package-adapters --dataset-hash에 쓴다)
hyperparams:                       # [확인: 서버 스크립트 기본값을 이전 세션이 읽음] arg_map에 인자가 있으면 넘기고, 없으면 기록만
  learning_rate: 0.0002
  epochs: 3
  per_device_batch_size: 2
  grad_accum_steps: 4
  max_len: 4096
  seed: 42
  lora_r: 16
  lora_alpha: 16
output:
  adapter_dir: ../runs/train/lora_a/adapter   # 어댑터가 나와야 하는 폴더. TODO: 서버 스크립트의 실제 출력 위치와 맞춘다
  # server_run_record: ../runs/train/lora_a/run.json   # 서버 run 기록이 있으면(키 이름 미확인) base_model_revision, dataset.content_hash만 옮긴다
  max_lora_rank: 16
  min_free_gb: 30
